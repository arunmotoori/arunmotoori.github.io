<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Overlay Blocking Button</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
    }

    .container {
      position: relative;
      width: 300px;
      height: 100px;
    }

    #submitBtn {
      width: 200px;
      height: 50px;
      font-size: 18px;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100px;
      background: rgba(255, 0, 0, 0.4);
      z-index: 100;

      /* Animate in and stay there */
      animation: coverButton 2s forwards;
    }

    @keyframes coverButton {
      from {
        left: -300px;
      }

      to {
        left: 0;
      }
    }
  </style>
</head>
<body>

  <h2>Button Covered by Overlay</h2>

  <div class="container">
    <button id="submitBtn">Submit</button>
    <div class="overlay"></div>
  </div>

  <script>
    document
      .getElementById('submitBtn')
      .addEventListener('click', () => {
        alert('Button clicked');
      });
  </script>

</body>
</html>
